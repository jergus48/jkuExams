<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transpozícia akordov</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js"></script>
<style>
:root{
  --bg:#1b1410; --panel:#2a1f18; --panel2:#33261d; --wood:#8b5a2b;
  --gold:#e0a84f; --gold2:#f3cf8a; --text:#f4ead9; --muted:#b9a68c; --line:#4a382a;
  --chord:#ffb85c; --lyric:#efe3cf;
}
*{box-sizing:border-box}
body{margin:0;background:
  radial-gradient(ellipse at top,#3a2718 0%,var(--bg) 60%) fixed;
  color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh}
.wrap{max-width:960px;margin:0 auto;padding:32px 16px 64px}
header{text-align:center;margin-bottom:28px}
header h1{font-family:'Playfair Display',serif;font-size:clamp(28px,6vw,46px);margin:0;
  background:linear-gradient(90deg,var(--gold),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{color:var(--muted);margin:8px 0 0}
.strings{height:22px;margin:14px auto 0;max-width:320px;display:flex;flex-direction:column;justify-content:space-between}
.strings span{display:block;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.7}
.strings span:nth-child(n+4){height:2px}
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
  border-radius:18px;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.35);margin-bottom:20px}
.drop{border:2px dashed var(--wood);border-radius:14px;padding:34px 16px;text-align:center;cursor:pointer;transition:.2s}
.drop:hover,.drop.over{border-color:var(--gold);background:rgba(224,168,79,.06)}
.drop .big{font-size:42px}
.drop b{color:var(--gold2)}
.drop small{color:var(--muted)}
#preview{max-width:100%;max-height:260px;border-radius:10px;margin-top:14px;display:none}
.progress{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:14px;display:none}
.progress div{height:100%;width:0;background:linear-gradient(90deg,var(--wood),var(--gold));transition:width .2s}
#status{color:var(--muted);font-size:14px;margin-top:8px;text-align:center;min-height:18px}
.controls{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center}
.btn{border:none;cursor:pointer;font:600 16px Inter;border-radius:999px;padding:12px 22px;
  background:var(--panel2);color:var(--text);border:1px solid var(--wood);transition:.15s}
.btn:hover{border-color:var(--gold);color:var(--gold2)}
.btn.primary{background:linear-gradient(180deg,var(--gold),#c98a2e);color:#2a1a0c;border:none}
.btn.primary:hover{filter:brightness(1.08);color:#2a1a0c}
.semi{text-align:center;min-width:120px}
.semi .n{font:700 34px 'Playfair Display',serif;color:var(--gold2)}
.semi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.opts{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:16px;font-size:14px;color:var(--muted)}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
select{background:var(--panel2);color:var(--text);border:1px solid var(--wood);border-radius:8px;padding:4px 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.chip{font:700 15px 'JetBrains Mono',monospace;padding:6px 12px;border-radius:10px;background:rgba(255,184,92,.12);
  color:var(--chord);border:1px solid rgba(255,184,92,.35)}
.chip s{color:var(--muted);font-weight:400;text-decoration:none;font-size:12px;margin-right:4px}
.sheet{font:15px/1.55 'JetBrains Mono',monospace;white-space:pre;overflow-x:auto;color:var(--lyric);
  background:#140e0a;border-radius:12px;padding:18px;border:1px solid var(--line)}
.sheet .c{color:var(--chord);font-weight:700}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1}
textarea{width:100%;min-height:260px;background:#140e0a;color:var(--lyric);border:1px solid var(--line);
  border-radius:12px;padding:14px;font:14px/1.5 'JetBrains Mono',monospace;resize:vertical}
.hint{font-size:13px;color:var(--muted);margin:6px 0 10px}
h2{font-family:'Playfair Display',serif;color:var(--gold2);margin:0 0 12px;font-size:22px}
.hidden{display:none}
.diagrams{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.dg{background:#140e0a;border:1px solid var(--line);border-radius:12px;padding:10px 4px 4px;text-align:center}
.dn{font:700 17px 'JetBrains Mono',monospace;color:var(--chord)}
@media print{body{background:#fff;color:#000}.card:not(#outCard){display:none}.sheet{background:#fff;color:#000;border:none}.sheet .c{color:#a0520a}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Transpozícia akordov</h1>
    <p>Nahraj fotku piesne s akordmi a posuň ju vyššie alebo nižšie</p>
    <div class="strings"><span></span><span></span><span></span><span></span><span></span><span></span></div>
  </header>

  <div class="card">
    <div class="drop" id="drop">
      <div class="big">🎸</div>
      <div><b>Klikni alebo sem pretiahni obrázok</b></div>
      <small>JPG, PNG, aj screenshot (Ctrl+V)</small>
      <input type="file" id="file" accept="image/*" hidden>
      <img id="preview" alt="">
    </div>
    <div class="progress" id="prog"><div></div></div>
    <div id="status"></div>
  </div>

  <div class="card hidden" id="ctlCard">
    <div class="controls">
      <button class="btn" id="down">▼ Nižšie</button>
      <div class="semi"><div class="n" id="semi">0</div><div class="l">poltóny</div></div>
      <button class="btn" id="up">Vyššie ▲</button>
      <button class="btn primary" id="reset">Pôvodná</button>
    </div>
    <div class="opts">
      <label>Zápis: <select id="notation"><option value="H">H (slovenský)</option><option value="B">B (anglický)</option></select></label>
      <label>Posuvky: <select id="acc"><option value="auto">automaticky</option><option value="#">krížiky ♯</option><option value="b">béčka ♭</option></select></label>
      <label id="capoLbl"></label>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="card hidden" id="dgCard">
    <h2>Hmaty</h2>
    <div class="diagrams" id="diagrams"></div>
  </div>

  <div class="card hidden" id="outCard">
    <div class="tabs">
      <button class="btn primary" id="tView">Pieseň</button>
      <button class="btn" id="tEdit">Opraviť text</button>
      <button class="btn" id="print">Tlačiť</button>
    </div>
    <div id="viewPane"><div class="sheet" id="sheet"></div></div>
    <div id="editPane" class="hidden">
      <p class="hint">Ak rozpoznávanie niečo pokazilo, oprav to tu (pôvodná tónina). Zmeny sa hneď prejavia.</p>
      <textarea id="src" spellcheck="false"></textarea>
    </div>
  </div>
</div>

<script>
const SHARP=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT =['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const IDX={C:0,D:2,E:4,F:5,G:7,A:9,B:11,H:11};
// chord token: root, accidental, quality/extensions, optional bass
const CHORD=/^([A-H])(#|b|is|es|s)?((?:maj|min|mi|m|M|dim|aug|sus|add|\+|°|ø|[0-9]|\(|\)|-|#|b)*)(?:\/([A-H])(#|b|is|es|s)?)?$/;

let semi=0, srcText='';
const $=id=>document.getElementById(id);

function noteIndex(r,a){
  let i=IDX[r];
  if(r==='B' && $('notation').dataset.detected==='H') i=10; // B in H-notation = Bb
  if(a==='#'||a==='is') i++;
  if(a==='b'||a==='es'||a==='s') i--;
  return (i+12)%12;
}
function noteName(i,useFlat){
  let n=(useFlat?FLAT:SHARP)[i];
  if($('notation').value==='H'){ if(n==='B') n='H'; else if(n==='Bb') n='B'; else if(n==='A#') n='B'; }
  return n;
}
function useFlats(){
  const a=$('acc').value; if(a!=='auto') return a==='b';
  const flatKeys=[1,3,5,8,10]; // keys usually written with flats
  return flatKeys.includes(((window.firstRoot??0)+semi+120)%12);
}
function transposeChord(tok){
  const m=tok.match(CHORD); if(!m) return tok;
  const f=useFlats();
  let out=noteName((noteIndex(m[1],m[2])+semi+120)%12,f)+(m[3]||'');
  if(m[4]) out+='/'+noteName((noteIndex(m[4],m[5])+semi+120)%12,f);
  return out;
}
function isChord(t){
  const m=t.match(CHORD); if(!m) return false;
  return m[3].length<10;
}
function isChordLine(line){
  const toks=line.trim().split(/\s+/).filter(Boolean);
  if(!toks.length) return false;
  const c=toks.filter(t=>isChord(t.replace(/[|,]/g,''))).length;
  return c/toks.length>=0.6;
}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}

function render(){
  const lines=srcText.split('\n');
  const seen=new Map();
  window.firstRoot=undefined;
  // detect H-notation in source
  const hasH=/(^|\s)H(mi|m|7|maj|sus|\s|$)/m.test(srcText);
  $('notation').dataset.detected=hasH?'H':'B';
  const hit=clean=>{
    const m=clean.match(CHORD);
    if(window.firstRoot===undefined) window.firstRoot=noteIndex(m[1],m[2]);
    const nt=transposeChord(clean);
    seen.set(clean,{nt,root:(noteIndex(m[1],m[2])+semi+120)%12,q:m[3]||''});
    return nt;
  };
  let html='';
  for(const line of lines){
    if(!isChordLine(line)){
      // chords written inline between lyrics; a sentence-initial "A" is the Slovak word, not a chord
      let first=true;
      html+=line.split(/(\s+)/).map(tok=>{
        if(!tok||/^\s+$/.test(tok)) return esc(tok);
        const wasFirst=first; first=false;
        const clean=tok.replace(/[|,.;:!?]/g,'');
        if(!isChord(clean)||(clean==='A'&&wasFirst)) return esc(tok);
        return `<span class="c">${esc(tok.replace(clean,hit(clean)))}</span>`;
      }).join('')+'\n';
      continue;
    }
    // keep column alignment: replace each token, pad/trim the following whitespace
    let out='', debt=0;
    line.replace(/(\S+)(\s*)/g,(_,tok,sp)=>{
      const lead=out.length?'':'';
      const clean=tok.replace(/[|,]/g,'');
      if(!isChord(clean)){out+=esc(tok)+sp;return'';}
      const nt=hit(clean);
      const diff=nt.length-tok.length+debt;
      let s=sp;
      if(sp.length){ const cut=Math.min(diff,sp.length-1); s=' '.repeat(Math.max(1,sp.length-cut)); debt=diff-(sp.length-s.length);} else debt=diff;
      out+=`<span class="c">${esc(tok.replace(clean,nt))}</span>`+s;
      return'';
    });
    html+=out+'\n';
  }
  // leading whitespace of chord lines is preserved by regex? add it back
  $('sheet').innerHTML=html;
  $('semi').textContent=(semi>0?'+':'')+semi;
  const uniq=new Map([...seen.values()].map(v=>[v.nt,v]));
  $('chips').innerHTML=[...seen].map(([o,v])=>`<span class="chip">${semi?`<s>${esc(o)}</s>`:''}${esc(v.nt)}</span>`).join('');
  $('diagrams').innerHTML=[...uniq.values()].map(v=>`<div class="dg"><div class="dn">${esc(v.nt)}</div>${diagram(v.root,v.q)}</div>`).join('');
  const capo=((-semi)%12+12)%12;
  $('capoLbl').textContent=semi<0&&capo?`Tip: s pôvodnými hmatmi = capo na ${capo}. pražci`:'';
}
// ---- chord diagrams ----
// strings low E..high e, -1 = muted; movable templates relative to root fret
const X=-1;
const SHAPES={ // quality: {E: E-string-root shape, A: A-string-root shape}
  '':    {E:[0,2,2,1,0,0], A:[X,0,2,2,2,0]},
  m:     {E:[0,2,2,0,0,0], A:[X,0,2,2,1,0]},
  '7':   {E:[0,2,0,1,0,0], A:[X,0,2,0,2,0]},
  m7:    {E:[0,2,0,0,0,0], A:[X,0,2,0,1,0]},
  maj7:  {E:[0,X,1,1,0,X], A:[X,0,2,1,2,0]},
  sus4:  {E:[0,2,2,2,0,0], A:[X,0,2,2,3,0]},
  sus2:  {A:[X,0,2,2,0,0]},
  '6':   {E:[0,2,2,1,2,0], A:[X,0,2,2,2,2]},
  m6:    {E:[0,2,2,0,2,0], A:[X,0,2,2,1,2]},
  add9:  {A:[X,0,2,4,2,0]},
  dim:   {A:[X,0,1,2,1,X]},
  dim7:  {A:[X,0,1,2,1,2]},
  m7b5:  {A:[X,0,1,0,1,X]},
  aug:   {A:[X,0,3,2,2,1]},
  '5':   {E:[0,2,2,X,X,X], A:[X,0,2,2,X,X]},
};
const OPEN={ // nicer open-position shapes, key = root index + quality
  '0':[X,3,2,0,1,0],'0|7':[X,3,2,3,1,0],'0|maj7':[X,3,2,0,0,0],'0|add9':[X,3,2,0,3,0],
  '2':[X,X,0,2,3,2],'2|m':[X,X,0,2,3,1],'2|7':[X,X,0,2,1,2],'2|m7':[X,X,0,2,1,1],'2|maj7':[X,X,0,2,2,2],
  '2|sus4':[X,X,0,2,3,3],'2|sus2':[X,X,0,2,3,0],
  '7':[3,2,0,0,0,3],'7|7':[3,2,0,0,0,1],'7|maj7':[3,2,0,0,0,2],
  '5|maj7':[X,X,3,2,1,0],'11|7':[X,2,1,2,0,2],'4|m7':[0,2,2,0,3,0],
};
function normQ(q){
  q=q.replace(/[()]/g,'');
  if(/^(m7b5|m7-5|ø)/.test(q)) return 'm7b5';
  if(/^(dim7|°7)/.test(q)) return 'dim7';
  if(/^(dim|°)/.test(q)) return 'dim';
  if(/^(aug|\+)/.test(q)) return 'aug';
  if(/^(maj|M)/.test(q)) return 'maj7';
  if(/^(m6|min6)/.test(q)) return 'm6';
  if(/^(m|min|mi|-)\d/.test(q)) return 'm7';
  if(/^(m|min|-)/.test(q)) return /sus/.test(q)?'sus4':'m';
  if(/sus2/.test(q)) return 'sus2';
  if(/sus/.test(q)) return 'sus4';
  if(/add(9|2)|^2/.test(q)) return 'add9';
  if(/^6/.test(q)) return '6';
  if(/^5/.test(q)) return '5';
  if(/^(7|9|11|13)/.test(q)) return '7';
  return '';
}
function voicing(root,q){
  const nq=normQ(q);
  const key=root+(nq?'|'+nq:'');
  if(OPEN[key]) return OPEN[key];
  const sh=SHAPES[nq]||SHAPES[''];
  const cands=[];
  if(sh.E) cands.push(sh.E.map(f=>f<0?X:f+(root-4+12)%12));
  if(sh.A) cands.push(sh.A.map(f=>f<0?X:f+(root-9+12)%12));
  // lowest position wins
  return cands.sort((a,b)=>Math.max(...a)-Math.max(...b))[0];
}
function diagram(root,q){
  const v=voicing(root,q);
  const played=v.filter(f=>f>0), max=Math.max(0,...played), min=played.length?Math.min(...played):1;
  const base=max<=4?1:min;
  const W=110,H=130,L=18,T=26,sx=(W-L-12)/5,sy=20;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`;
  // frets + nut
  for(let i=0;i<=5;i++) s+=`<line x1="${L}" x2="${L+5*sx}" y1="${T+i*sy}" y2="${T+i*sy}" stroke="#7a5a3c" stroke-width="${i===0&&base===1?4:1.2}"/>`;
  for(let i=0;i<6;i++) s+=`<line x1="${L+i*sx}" x2="${L+i*sx}" y1="${T}" y2="${T+5*sy}" stroke="#d9c3a0" stroke-width="${1.6-i*0.15}"/>`;
  if(base>1) s+=`<text x="${L-6}" y="${T+sy*0.7}" text-anchor="end" font-size="10" fill="#b9a68c">${base}</text>`;
  // barre: lowest fretted fret used on 3+ strings from the lowest played string upward
  const first=v.findIndex(f=>f>=0);
  if(base>1&&v.filter(f=>f===min).length>=2){
    const ss=v.map((f,i)=>f===min?i:-1).filter(i=>i>=0), a=Math.min(...ss), b=Math.max(...ss);
    s+=`<rect x="${L+a*sx-6}" y="${T+(min-base+0.5)*sy-6}" width="${(b-a)*sx+12}" height="12" rx="6" fill="#ffb85c"/>`;
  }
  v.forEach((f,i)=>{
    const x=L+i*sx;
    if(f<0) s+=`<text x="${x}" y="${T-8}" text-anchor="middle" font-size="11" fill="#b9a68c">✕</text>`;
    else if(f===0) s+=`<circle cx="${x}" cy="${T-11}" r="4" fill="none" stroke="#d9c3a0" stroke-width="1.4"/>`;
    else s+=`<circle cx="${x}" cy="${T+(f-base+0.5)*sy}" r="6" fill="${i===first?'#f3cf8a':'#ffb85c'}"/>`;
  });
  return s+'</svg>';
}
function prep(t){return t.replace(/\r/g,'').replace(/[“”]/g,'"').replace(/♯/g,'#').replace(/♭/g,'b');}

function setText(t){srcText=prep(t);$('src').value=srcText;semi=0;
  ['ctlCard','dgCard','outCard'].forEach(i=>$(i).classList.remove('hidden'));render();}

// small screenshots and coloured text OCR badly: upscale and turn into black on white
function prepareImage(url){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      const k=Math.max(1,Math.min(4,1800/img.width));
      const c=document.createElement('canvas');
      c.width=img.width*k;c.height=img.height*k;
      const g=c.getContext('2d');
      g.imageSmoothingQuality='high';
      g.drawImage(img,0,0,c.width,c.height);
      const d=g.getImageData(0,0,c.width,c.height),p=d.data;
      for(let i=0;i<p.length;i+=4){
        const v=Math.min(p[i],p[i+1],p[i+2])<140?0:255; // darkest channel keeps blue/red text dark
        p[i]=p[i+1]=p[i+2]=v;
      }
      g.putImageData(d,0,0);
      res(c);
    };
    img.onerror=rej;img.src=url;
  });
}

async function handleFile(file){
  if(!file||!file.type.startsWith('image/'))return;
  const url=URL.createObjectURL(file);
  $('preview').src=url;$('preview').style.display='block';
  $('prog').style.display='block';$('status').textContent='Načítavam rozpoznávanie textu…';
  try{
    const {data}=await Tesseract.recognize(await prepareImage(url),'slk+eng',{
      logger:m=>{ if(m.status==='recognizing text'){$('prog').firstElementChild.style.width=(m.progress*100)+'%';$('status').textContent='Čítam akordy… '+Math.round(m.progress*100)+' %';}},
      preserve_interword_spaces:'1'
    });
    $('status').textContent='Hotovo. Ak niečo nesedí, klikni na „Opraviť text“.';
    setText(data.text);
  }catch(e){$('status').textContent='Chyba pri čítaní obrázka: '+e.message;}
}

$('drop').onclick=e=>{if(e.target.id!=='file')$('file').click()};
$('file').onchange=e=>handleFile(e.target.files[0]);
['dragover','dragenter'].forEach(ev=>$('drop').addEventListener(ev,e=>{e.preventDefault();$('drop').classList.add('over')}));
['dragleave','drop'].forEach(ev=>$('drop').addEventListener(ev,e=>{e.preventDefault();$('drop').classList.remove('over')}));
$('drop').addEventListener('drop',e=>handleFile(e.dataTransfer.files[0]));
window.addEventListener('paste',e=>{const it=[...e.clipboardData.items].find(i=>i.type.startsWith('image/'));if(it)handleFile(it.getAsFile());});

$('down').onclick=()=>{semi=Math.max(-11,semi-1);render()};
$('up').onclick=()=>{semi=Math.min(11,semi+1);render()};
$('reset').onclick=()=>{semi=0;render()};
$('notation').onchange=render;$('acc').onchange=render;
$('src').oninput=()=>{srcText=$('src').value;render()};
$('tView').onclick=()=>{$('viewPane').classList.remove('hidden');$('editPane').classList.add('hidden');$('tView').classList.add('primary');$('tEdit').classList.remove('primary')};
$('tEdit').onclick=()=>{$('editPane').classList.remove('hidden');$('viewPane').classList.add('hidden');$('tEdit').classList.add('primary');$('tView').classList.remove('primary')};
$('print').onclick=()=>window.print();
document.addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA')return;if(e.key==='ArrowUp'){$('up').click();e.preventDefault()}if(e.key==='ArrowDown'){$('down').click();e.preventDefault()}});
</script>
</body>
</html>
