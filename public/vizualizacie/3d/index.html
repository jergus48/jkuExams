<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Byt 7C v 3D</title>
<link rel="icon" type="image/png" href="/vizualizacie/3d/app/img/favicon.png">
<style>
/* Obal pre 3D aplikáciu (app/showcase.html v iframe): hlavička s odkazom späť na kuchyňu, aplikácia hlási svoju výšku, aby sa stránka posúvala ako celok. */
:root{color-scheme:dark;--bg:#0e0f12;--ink:#e8ecec;--muted:#9aa3a5;--line:#2a2e33;--accent:#b0e562}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:22px 20px 48px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px;margin-bottom:14px}
h1{margin:0;font-size:26px;font-weight:600}
header p{margin:4px 0 0;color:var(--muted);max-width:80ch}
a{color:var(--accent)}
.frame{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#0a0a0c}
.frame iframe{display:block;width:100%;height:900px;border:0;background:#0a0a0c}
@media (max-width:640px){.frame{border-radius:10px;margin-inline:-8px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Byt 7C v 3D</h1>
      <p>Celý byt podľa tatinovho pôdorysu. Nábytok sa dá v pôdoryse presúvať a otáčať, IKEA kusy sa pridávajú v záložke IKEA nábytok.</p>
    </div>
    <a href="/vizualizacie/">Späť na varianty kuchyne</a>
  </header>
  <div class="frame"><iframe id="demoFrame" src="/vizualizacie/3d/app/showcase.html" title="Byt 7C v 3D" allow="fullscreen"></iframe></div>
</div>
<script>
(function () {
  var frame = document.getElementById('demoFrame')
  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin || e.source !== frame.contentWindow) return
    var h = e.data && Number(e.data.swx3dHeight)
    if (h > 0) frame.style.height = Math.max(640, Math.ceil(h) + 4) + 'px'
  })
})()
</script>
</body>
</html>
